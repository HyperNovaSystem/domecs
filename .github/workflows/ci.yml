name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # O-73 (X8): every Node line the packages claim (engines >=18 is
    # exercised from 20, the oldest maintained LTS).
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Reads the "packageManager": "pnpm@10.30.2" field from package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --parallel typecheck

      - name: Build
        run: pnpm -r build

      - name: Agent legibility gate (WS-3 — runs against built dist)
        run: pnpm test:legibility

      - name: Doctests (L6 — examples are tested documentation)
        run: pnpm doctest

      - name: Regenerate API surface
        run: pnpm api:surface

      - name: No-drift gate — committed API surface must match build
        run: |
          git diff --exit-code -- doc/api-surface \
            || { echo "::error::API-surface drift. Run 'pnpm api:surface' and commit doc/api-surface/."; exit 1; }

      - name: Unit tests
        run: pnpm -r --parallel test

      - name: API-surface gate test
        run: pnpm api:check

      - name: Doctest harness unit tests
        run: pnpm doctest:check

      - name: Bench statistics unit tests
        run: pnpm test:bench

      - name: Release validation
        run: pnpm test:release

      # Spec §3.4: fixed worlds hash the same as test/golden/determinism.json
      # on every Node in the matrix (packages were built above).
      - name: Determinism golden
        run: node --test test/golden.test.mjs

      # Packs the packages and installs the tarballs into a fresh project —
      # the payload `pnpm publish` would ship (O-73). Once per run is enough.
      - name: Cold install from packed tarballs
        if: matrix.node-version == 22
        run: pnpm test:cold-install
        env:
          RUN_COLD_INSTALL: '1'
