# Deploy Plantroom (flagship operable sim) to GitHub Pages.
# Site: https://hypernovasystem.github.io/domecs/

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'example/plantroom/**'
      - 'packages/domecs/**'
      - 'packages/domecs-dom/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build runtime packages (Plantroom aliases to source; build is still good hygiene)
        run: pnpm --filter @domecs/core --filter @domecs/dom build

      - name: Build Plantroom for project Pages
        # vite.config.js sets base=/domecs/ when GITHUB_ACTIONS=true
        run: pnpm --filter @domecs/example-plantroom build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: example/plantroom/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
