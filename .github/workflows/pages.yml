# Deploy Plantroom (flagship operable sim) to GitHub Pages.
# Site: https://hypernovasystem.github.io/domecs/

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'example/plantroom/**'
      - 'packages/domecs/**'
      - 'packages/domecs-dom/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress stays false per the official Pages pattern: in-flight
# production deployments complete; queued runs are still skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit to releases that run on Node 24 (GitHub
      # deprecated the Node 20 runtime); each pin's comment names its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      # Node 26 is the active LTS (20 reached its end of life in April 2026).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enable Pages (first-deploy safe — no manual settings flip needed)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true

      - name: Build runtime packages (Plantroom aliases to source; build is still good hygiene)
        run: pnpm --filter @domecs/core --filter @domecs/dom build

      - name: Build Plantroom for project Pages
        # vite.config.js sets base=/domecs/ when GITHUB_ACTIONS=true
        run: pnpm --filter @domecs/example-plantroom build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: example/plantroom/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
